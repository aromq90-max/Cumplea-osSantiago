<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Super Santiago Bros World 1-1</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after {
            touch-action: manipulation !important;
            -webkit-touch-callout: none !important;
            -webkit-user-select: none !important;
            user-select: none !important;
            -webkit-tap-highlight-color: transparent !important;
        }

        html, body {
            height: 100%;
            width: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #000000;
            font-family: 'Press Start 2P', cursive;
        }

        .pixel-art {
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        .mario-border {
            border: 3px solid #ffffff;
            box-shadow: 0 0 0 3px #000000, 0 6px 15px rgba(0,0,0,0.8);
        }

        .nes-btn {
            background: linear-gradient(180deg, #e52521 0%, #a81000 100%);
            border: 2px solid #ffffff;
            color: #ffffff;
            text-shadow: 1px 1px #000000;
            box-shadow: inset -2px -2px 0px 0px #600000, 0 3px 0 #000;
            cursor: pointer;
        }

        .nes-btn:active {
            transform: translateY(2px);
            box-shadow: inset 1px 1px 0px 0px #600000, 0 1px 0 #000;
        }

        .nes-btn-green {
            background: linear-gradient(180deg, #00a800 0%, #005000 100%);
            box-shadow: inset -2px -2px 0px 0px #003000, 0 3px 0 #000;
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center h-dvh w-screen text-white relative p-1 overflow-hidden select-none">

    <!-- AUDIO MARIO.MP3 -->
    <audio id="bgmAudio" src="./mario.mp3" loop preload="auto"></audio>

    <div class="relative w-full max-w-2xl h-full flex flex-col items-center justify-between py-1">
        
        <!-- HUD BAR -->
        <div class="w-full bg-black border-2 sm:border-4 border-white p-1.5 mb-1 flex justify-between items-center text-[8px] sm:text-xs tracking-wider mario-border rounded-lg shrink-0 z-10">
            <div class="flex flex-col">
                <span class="text-red-500 font-bold">SANTIAGO</span>
                <span id="hud-score" class="text-white">000000</span>
            </div>

            <div class="flex flex-col items-center">
                <span class="text-yellow-400">COINS</span>
                <span id="hud-coins" class="text-white">🪙x00</span>
            </div>

            <div class="flex flex-col items-center">
                <span class="text-blue-400">WORLD</span>
                <span class="text-white">1-1</span>
            </div>

            <div class="flex flex-col items-center">
                <span class="text-yellow-400">TIME</span>
                <span id="hud-time" class="text-white">400</span>
            </div>

            <button id="audioToggle" type="button" class="bg-gray-800 border border-white px-2 py-1 rounded text-[10px]">🔊</button>
        </div>

        <!-- GAME CANVAS CONTAINER -->
        <div class="relative w-full aspect-[256/224] max-h-[60vh] bg-[#5c94fc] border-2 sm:border-4 border-white rounded-xl overflow-hidden shadow-2xl mario-border flex-1 flex items-center justify-center">
            <canvas id="gameCanvas" width="256" height="224" class="w-full h-full pixel-art block object-contain"></canvas>

            <!-- MENÚ INICIAL -->
            <div id="startMenuModal" class="absolute inset-0 bg-black/85 flex flex-col items-center justify-center p-2 text-center z-50">
                <div class="mario-border bg-gradient-to-b from-blue-900 via-indigo-950 to-black p-4 max-w-sm w-full rounded-xl flex flex-col items-center justify-center">
                    
                    <div class="bg-red-600 text-yellow-300 border border-white px-2 py-1 text-[9px] mb-2 rounded font-bold">
                        ★ SUPER SANTIAGO BROS WORLD 1-1 ★
                    </div>
                    <h1 class="text-yellow-400 text-base sm:text-lg mb-0.5">SUPER SANTIAGO</h1>
                    <p class="text-green-400 text-xs mb-3">SANTIAGO CUMPLE 5 AÑOS</p>

                    <!-- BOTONES CON INVITACIÓN ARRIBA Y JUGAR ABAJO -->
                    <div class="w-full space-y-3">
                        <button id="btnViewInvite" type="button" class="nes-btn nes-btn-green w-full py-3 rounded-lg text-xs uppercase tracking-wider block">
                            🎂 VER INVITACIÓN
                        </button>

                        <button id="btnPlayGame" type="button" class="nes-btn w-full py-3 rounded-lg text-xs uppercase tracking-wider block">
                            ▶ JUGAR AVENTURA
                        </button>
                    </div>

                    <p class="text-[8px] text-gray-400 mt-3">Usa Teclado o Controles Táctiles</p>
                </div>
            </div>

            <!-- MODAL INVITACIÓN -->
            <div id="inviteModal" class="hidden absolute inset-0 bg-black/90 flex flex-col items-center justify-center p-2 z-50">
                <div class="mario-border bg-gradient-to-b from-red-950 via-yellow-950 to-black p-4 max-w-sm w-full rounded-xl relative text-center flex flex-col justify-between">
                    <button id="btnCloseInvite" type="button" class="absolute top-2 right-2 bg-red-600 text-white border border-white w-8 h-8 rounded-full text-xs font-bold flex items-center justify-center z-50">✕</button>

                    <h2 class="text-xl text-red-500 mt-1 mb-0.5">SANTIAGO</h2>
                    <p class="text-xs text-yellow-400 mb-2">¡MI CUMPLE #5 EN CONEY PARK!</p>

                    <div class="bg-black/80 border border-white rounded-lg p-2 text-left text-[9px] space-y-1.5 mb-2">
                        <p class="text-yellow-300">📅 FECHA: <span class="text-white">Sábado, 10 de Octubre</span></p>
                        <p class="text-blue-300">⏰ HORA: <span class="text-white">6:30 PM</span></p>
                        <p class="text-green-300">📍 LUGAR: <span class="text-white">Coney Park - San Miguel</span></p>
                    </div>

                    <div class="grid grid-cols-3 gap-1 mb-2">
                        <button id="btnToastBloque" type="button" class="bg-yellow-500 border border-white p-2 rounded text-[8px] text-black font-bold">❓ BLOQUE</button>
                        <button id="btnToastEstrella" type="button" class="bg-yellow-500 border border-white p-2 rounded text-[8px] text-black font-bold">⭐ ESTRELLA</button>
                        <button id="btnToastHongo" type="button" class="bg-red-500 border border-white p-2 rounded text-[8px] text-white font-bold">🍄 HONGO</button>
                    </div>

                    <div id="toastMessage" class="hidden bg-yellow-300 text-black text-[9px] p-1.5 rounded mb-2 font-bold border border-black"></div>

                    <button id="btnStartFromInvite" type="button" class="nes-btn w-full py-2.5 text-xs rounded uppercase">
                        ▶ JUGAR MUNDO 1-1
                    </button>
                </div>
            </div>
        </div>

        <!-- CONTROLES TÁCTILES MÓVILES -->
        <div class="w-full flex justify-between items-center mt-1 px-1 sm:hidden shrink-0 z-30">
            <div class="grid grid-cols-3 gap-1 w-28 h-28">
                <div></div>
                <button id="btnUp" type="button" class="bg-gray-800 border border-white text-white rounded-lg flex items-center justify-center font-bold text-base">▲</button>
                <div></div>
                <button id="btnLeft" type="button" class="bg-gray-800 border border-white text-white rounded-lg flex items-center justify-center font-bold text-base">◀</button>
                <div class="bg-gray-900 border border-gray-700 rounded-full flex items-center justify-center text-[7px] text-gray-500">NES</div>
                <button id="btnRight" type="button" class="bg-gray-800 border border-white text-white rounded-lg flex items-center justify-center font-bold text-base">▶</button>
                <div></div>
                <button id="btnDown" type="button" class="bg-gray-800 border border-white text-white rounded-lg flex items-center justify-center font-bold text-base">▼</button>
                <div></div>
            </div>

            <div class="flex space-x-2 items-center">
                <div class="flex flex-col items-center space-y-0.5">
                    <button id="btnRun" type="button" class="w-12 h-12 bg-red-600 border border-white rounded-full text-white font-bold flex items-center justify-center text-xs">B</button>
                    <span class="text-[7px] text-gray-400">CORRER</span>
                </div>
                <div class="flex flex-col items-center space-y-0.5">
                    <button id="btnJump" type="button" class="w-12 h-12 bg-yellow-500 border border-white rounded-full text-black font-bold flex items-center justify-center text-xs">A</button>
                    <span class="text-[7px] text-gray-400">SALTAR</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const bgm = document.getElementById('bgmAudio');

        let gameRunning = false;

        // Estado del jugador (Santiago / Mario)
        const player = {
            x: 30,
            y: 160,
            width: 14,
            height: 16,
            velocityX: 0,
            velocityY: 0,
            speed: 1.8,
            jumpPower: -6.5,
            gravity: 0.35,
            grounded: false
        };

        const keys = { left: false, right: false, up: false };

        // Dibujar elementos en pantalla
        function drawScene() {
            // Fondo azul cielo
            ctx.fillStyle = '#5c94fc';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Suelo (estilo NES)
            ctx.fillStyle = '#c84c0c';
            ctx.fillRect(0, 192, canvas.width, 32);

            // Detalle superior del suelo
            ctx.fillStyle = '#00a800';
            ctx.fillRect(0, 192, canvas.width, 4);

            // Bloque de interrogación ?
            ctx.fillStyle = '#fc9838';
            ctx.fillRect(80, 130, 16, 16);
            ctx.fillStyle = '#000000';
            ctx.font = '10px "Press Start 2P"';
            ctx.fillText('?', 84, 143);

            // Bloques de ladrillo
            ctx.fillStyle = '#b84418';
            ctx.fillRect(120, 130, 16, 16);
            ctx.fillRect(136, 130, 16, 16);

            // Santiago (Personaje)
            ctx.fillStyle = '#e52521'; // Gorra/Camisa roja
            ctx.fillRect(player.x, player.y, player.width, player.height);
            ctx.fillStyle = '#0024e0'; // Overol azul
            ctx.fillRect(player.x + 2, player.y + 8, player.width - 4, 8);
        }

        function updateGame() {
            if (!gameRunning) return;

            // Movimiento lateral
            if (keys.left) player.velocityX = -player.speed;
            else if (keys.right) player.velocityX = player.speed;
            else player.velocityX = 0;

            // Salto
            if (keys.up && player.grounded) {
                player.velocityY = player.jumpPower;
                player.grounded = false;
            }

            // Gravedad
            player.velocityY += player.gravity;

            // Aplicar posiciones
            player.x += player.velocityX;
            player.y += player.velocityY;

            // Colisión con el suelo
            if (player.y + player.height >= 192) {
                player.y = 192 - player.height;
                player.velocityY = 0;
                player.grounded = true;
            }

            // Limites laterales
            if (player.x < 0) player.x = 0;
            if (player.x + player.width > canvas.width) player.x = canvas.width - player.width;

            drawScene();
            requestAnimationFrame(updateGame);
        }

        function startGame() {
            gameRunning = true;
            document.getElementById('startMenuModal').classList.add('hidden');
            document.getElementById('inviteModal').classList.add('hidden');
            if (bgm && bgm.paused) bgm.play().catch(() => {});
            updateGame();
        }

        function showToast(msg) {
            const toast = document.getElementById('toastMessage');
            if (toast) {
                toast.innerText = msg;
                toast.classList.remove('hidden');
                setTimeout(() => toast.classList.add('hidden'), 2500);
            }
        }

        function bindTouchAction(id, handler) {
            const el = document.getElementById(id);
            if (!el) return;

            const execute = (e) => {
                if (e.cancelable) e.preventDefault();
                handler();
            };

            el.addEventListener('pointerdown', execute, { passive: false });
            el.addEventListener('click', execute, { passive: false });
        }

        // Eventos del teclado
        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = true;
            if (e.key === 'ArrowRight' || e.key === 'd') keys.right = true;
            if (e.key === 'ArrowUp' || e.key === 'w' || e.key === ' ') keys.up = true;
        });

        window.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = false;
            if (e.key === 'ArrowRight' || e.key === 'd') keys.right = false;
            if (e.key === 'ArrowUp' || e.key === 'w' || e.key === ' ') keys.up = false;
        });

        document.addEventListener('DOMContentLoaded', () => {
            drawScene(); // Render inicial del escenario

            bindTouchAction('btnPlayGame', startGame);
            bindTouchAction('btnStartFromInvite', startGame);

            bindTouchAction('btnViewInvite', () => {
                document.getElementById('startMenuModal').classList.add('hidden');
                document.getElementById('inviteModal').classList.remove('hidden');
            });

            bindTouchAction('btnCloseInvite', () => {
                document.getElementById('inviteModal').classList.add('hidden');
                document.getElementById('startMenuModal').classList.remove('hidden');
            });

            // Controles táctiles móviles
            bindTouchAction('btnLeft', () => keys.left = true);
            bindTouchAction('btnRight', () => keys.right = true);
            bindTouchAction('btnJump', () => {
                keys.up = true;
                setTimeout(() => keys.up = false, 200);
            });

            document.getElementById('btnLeft').addEventListener('pointerup', () => keys.left = false);
            document.getElementById('btnRight').addEventListener('pointerup', () => keys.right = false);

            bindTouchAction('btnToastBloque', () => showToast('🎉 ¡Te esperamos con toda la diversión!'));
            bindTouchAction('btnToastEstrella', () => showToast('⭐ ¡Energía y Poder Invencible!'));
            bindTouchAction('btnToastHongo', () => showToast('🍄 ¡Santiago crece a 5 Años!'));

            bindTouchAction('audioToggle', () => {
                if (bgm.paused) {
                    bgm.play();
                    document.getElementById('audioToggle').innerText = '🔊';
                } else {
                    bgm.pause();
                    document.getElementById('audioToggle').innerText = '🔇';
                }
            });
        });
    </script>
</body>
</html>
